    <script>
        const cartCountEl = document.getElementById('cart-count');
        let cartCount = 0;

        function updateQty(card, delta) {
            const qtyEl = card.querySelector('.qty');
            let qty = parseInt(qtyEl.textContent);
            const newQty = Math.max(0, qty + delta);
            cartCount += newQty - qty;
            qtyEl.textContent = newQty;
            cartCountEl.textContent = cartCount;
        }

        document.querySelectorAll('.add-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                updateQty(btn.closest('.product-card'), 1);
            });
        });
        document.querySelectorAll('.inc-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                updateQty(btn.closest('.product-card'), 1);
            });
        });
        document.querySelectorAll('.dec-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                updateQty(btn.closest('.product-card'), -1);
            });
        });

        document.getElementById('logout-btn').addEventListener('click', () => {
            if (confirm('Are you sure you want to logout?')) {
                alert('Logged out');
            }
        });

        const favicon = document.getElementById('favicon');
        const activeIcon = "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>%F0%9F%9B%92</text></svg>";
        const attentionIcon = "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>%F0%9F%91%80</text></svg>";

        document.addEventListener('visibilitychange', () => {
            favicon.href = document.hidden ? attentionIcon : activeIcon;
        });
    </script>
