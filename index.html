<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Basic Website</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <nav class="bg-gradient-to-r from-blue-600 via-purple-600 to-pink-600 p-4 shadow-lg">
        <div class="container mx-auto flex justify-between items-center text-white">
            <ul class="flex space-x-4">
                <li><a class="hover:underline" href="index.html">Home</a></li>
                <li><a class="hover:underline" href="about.html">About</a></li>
                <li><a class="hover:underline" href="contact.html">Contact</a></li>
            </ul>
            <div class="space-x-2">
                <button class="px-3 py-1 bg-white text-gray-800 rounded shadow transition hover:shadow-lg active:scale-95">Profile</button>
                <button class="px-3 py-1 bg-white text-gray-800 rounded shadow transition hover:shadow-lg active:scale-95">Log Out</button>
            </div>
        </div>
    </nav>
    <main class="container mx-auto text-center py-20">
        <h1 class="text-4xl font-bold mb-4">Welcome to the Home Page</h1>
        <p class="text-lg text-gray-700">This is the main page of our basic website.</p>
        <div class="flex justify-center mt-12">
            <div class="max-w-sm bg-white rounded-lg shadow-lg overflow-hidden transform transition hover:shadow-2xl">
                <img class="w-full h-48 object-cover" src="https://via.placeholder.com/400x300" alt="Product image">
                <div class="p-4">
                    <h3 class="text-xl font-semibold mb-2">Sample Product</h3>
                    <p class="text-gray-600 mb-4">A short description of the product that highlights key features.</p>
                    <button class="px-4 py-2 bg-blue-600 text-white rounded shadow hover:bg-blue-700 transition active:scale-95">Add to Cart</button>
                </div>
            </div>
        </div>
    </main>
    <footer class="bg-gray-800 text-white text-center py-4 fixed bottom-0 w-full">
        <p>&copy; 2025 Basic Website</p>
    </footer>
</body>
</html>
