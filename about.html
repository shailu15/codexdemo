<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About - Basic Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="fade-in">
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="vendor.html">Vendor</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><button id="locate-btn">Track Location</button></li>
        </ul>
        <input id="search" type="text" placeholder="Search..." class="search-input">
    </nav>
    <main class="slide-up">
        <h1>About Us</h1>
        <p>This page provides information about the website.</p>
    </main>
    <footer class="bg-gray-800 text-white text-center py-4 w-full">
        <div class="mb-2 space-x-4">
            <a href="#" class="hover:text-blue-400">Twitter</a>
            <a href="#" class="hover:text-pink-500">Instagram</a>
            <a href="#" class="hover:text-blue-600">Facebook</a>
        </div>
        <p>&copy; 2025 Basic Website</p>
    </footer>
    <script>
        document.getElementById('locate-btn').addEventListener('click', () => {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    alert(`Latitude: ${pos.coords.latitude}\nLongitude: ${pos.coords.longitude}`);
                }, () => {
                    alert('Could not get location');
                });
            } else {
                alert('Geolocation not supported');
            }
        });
    </script>
</body>
</html>
