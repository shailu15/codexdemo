<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="fade-in">
    <nav class="bg-gradient-to-r from-blue-600 via-purple-600 to-pink-600 py-8 px-4 shadow-lg fixed top-0 left-0 w-full z-50" style="animation: slide-down 0.5s ease;">
        <div class="container mx-auto flex justify-between items-center text-white">
            <div class="flex items-center">
                <span class="text-xl font-bold">Neebys</span>
                <button id="menu-btn" class="sm:hidden ml-4 px-2 py-1 bg-white text-gray-800 rounded">☰</button>
            </div>
            <ul id="nav-links" class="hidden sm:flex space-x-4">
                <li><a class="hover:underline" href="index.html">Home</a></li>
                <li><a class="hover:underline" href="products.html">Products</a></li>
                <li><a class="hover:underline" href="vendor.html">Vendor</a></li>
                <li><a class="hover:underline" href="about.html">About</a></li>
                <li><a class="hover:underline" href="contact.html">Contact</a></li>
            </ul>
            <div class="space-x-4 flex items-center">
                <input id="search" type="text" placeholder="Search..." class="search-input" />
                <button id="locate-btn" title="Track Location" class="hidden sm:inline px-3 py-1 bg-white text-gray-800 rounded shadow transition hover:shadow-lg active:scale-95">📍</button>
            </div>
        </div>
    </nav>
    <div id="sidebar" class="fixed inset-y-0 left-0 w-64 bg-gradient-to-b from-blue-700 to-purple-700 text-white transform -translate-x-full transition-transform duration-200 sm:hidden z-50 shadow-2xl">
        <button id="close-sidebar" class="m-4 text-white text-xl">✖</button>
        <ul class="mt-8 space-y-4 px-6 font-medium">
            <li><a class="block hover:underline" href="index.html">Home</a></li>
            <li><a class="block hover:underline" href="products.html">Products</a></li>
            <li><a class="block hover:underline" href="vendor.html">Vendor</a></li>
            <li><a class="block hover:underline" href="about.html">About</a></li>
            <li><a class="block hover:underline" href="contact.html">Contact</a></li>
            <li><button id="sidebar-locate" class="w-full text-left hover:underline">Track Location</button></li>
        </ul>
    </div>
    <div id="overlay" class="fixed inset-0 bg-black bg-opacity-50 hidden sm:hidden z-40"></div>
    <main class="container mx-auto py-10">
        <h1 class="text-2xl font-bold mb-6 text-center">Vendor Product</h1>
        <div class="max-w-sm mx-auto bg-white p-4 rounded shadow text-center">
            <img src="https://picsum.photos/seed/vendor/300" alt="Vendor Product" class="w-full h-40 object-cover rounded mb-3">
            <h2 class="text-xl font-semibold">Sample Product</h2>
            <p class="text-red-600 mb-2">$19.99</p>
            <label class="block mb-4">Quantity:
                <input id="vendor-qty" type="number" value="1" min="1" class="border p-1 w-full rounded">
            </label>
            <button id="vendor-add" class="w-full bg-blue-600 text-white py-2 rounded">Add</button>
        </div>
    </main>
    <footer class="bg-gray-800 text-white text-center py-4 w-full">
        <div class="mb-2 space-x-4">
            <a href="#" class="hover:text-blue-400">Twitter</a>
            <a href="#" class="hover:text-pink-500">Instagram</a>
            <a href="#" class="hover:text-blue-600">Facebook</a>
        </div>
        <p>&copy; 2025 Basic Website</p>
    </footer>
    <script>
        document.getElementById('menu-btn').addEventListener('click', () => {
            document.getElementById('sidebar').classList.remove('-translate-x-full');
            document.getElementById('overlay').classList.remove('hidden');
        });
        document.getElementById('close-sidebar').addEventListener('click', () => {
            document.getElementById('sidebar').classList.add('-translate-x-full');
            document.getElementById('overlay').classList.add('hidden');
        });
        document.getElementById('overlay').addEventListener('click', () => {
            document.getElementById('sidebar').classList.add('-translate-x-full');
            document.getElementById('overlay').classList.add('hidden');
        });
        document.getElementById('sidebar-locate').addEventListener('click', () => {
            document.getElementById('locate-btn').click();
        });
        document.getElementById('locate-btn').addEventListener('click', () => {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    alert(`Latitude: ${pos.coords.latitude}\nLongitude: ${pos.coords.longitude}`);
                }, () => {
                    alert('Could not get location');
                });
            } else {
                alert('Geolocation not supported');
            }
        });
        document.getElementById('vendor-add').addEventListener('click', () => {
            const qty = document.getElementById('vendor-qty').value;
            alert(`Added ${qty} item(s) to cart`);
        });
    </script>
</body>
</html>
